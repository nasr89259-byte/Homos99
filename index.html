        function renderBooks(booksToDisplay) {
            const container = document.getElementById('books-container');
            container.innerHTML = '';
            if(booksToDisplay.length === 0) {
                container.innerHTML = `<p class="no-results">${currentLang === 'ar' ? 'عذراً، لم نجد نتائج تطابق بحثك.' : 'Sorry, no results matched your search.'}</p>`;
                return;
            }
            booksToDisplay.forEach(book => {
                const title = currentLang === 'ar' ? book.title_ar : book.title_en;
                const author = currentLang === 'ar' ? book.author_ar : book.author_en;
                const desc = currentLang === 'ar' ? book.desc_ar : book.desc_en;
                
                const cardHtml = `
                    <div class="book-card">
                        <div class="book-cover-wrapper">
                            <img src="${book.cover}" class="book-cover-img" alt="${title}" loading="lazy">
                        </div>
                        <div class="book-details">
                            <h3 class="book-title">${title}</h3>
                            <p class="book-author">${author}</p>
                            <p class="book-desc">${desc}</p>
                            <a href="${book.url}" target="_blank" class="btn-redirect">${uiWords[currentLang].btnRead}</a>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        function executeSearch() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const filtered = booksDatabase.filter(book => {
                return book.title_ar.toLowerCase().includes(query) || book.title_en.toLowerCase().includes(query) ||
                       book.author_ar.toLowerCase().includes(query) || book.author_en.toLowerCase().includes(query);
            });
            renderBooks(filtered);
        }

            root.setAttribute('dir', currentLang === 'en' ? 'ltr' : 'rtl');

        function toggleLoginModal() { document.getElementById('login-modal').classList.toggle('hidden'); }

        function switchAuthTab(type) {
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');

            if (type === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                formLogin.classList.remove('hidden');
                formRegister.classList.add('hidden');
            } else {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                formRegister.classList.remove('hidden');
                formLogin.classList.add('hidden');
            }
        }

        function processLoggedInUser(name) {
            toggleLoginModal();
            document.getElementById('btn-login-toggle').classList.add('hidden');
            const welcomeSpan = document.getElementById('user-welcome');
            welcomeSpan.textContent = uiWords[currentLang].welcome + name;
            welcomeSpan.classList.remove('hidden');
        }

        function handleAuthSubmit(event, type) {
            event.preventDefault();
            let name = "";
            if (type === 'login') {
                const email = document.getElementById('login-email').value;
                name = email.split('@')[0];
            } else {
                name = document.getElementById('reg-name').value;
            }
            processLoggedInUser(name);
        }

        function handleGoogleLogin() {
            let promptMsg = currentLang === 'ar' ? "يرجى كتابة اسمك للمحاكاة الذكية لتسجيل الدخول بجوجل:" : "Please enter your name for smart Google Sign-In simulation:";
            let name = prompt(promptMsg);
            if (name && name.trim() !== "") {
                processLoggedInUser(name.trim());
            }
        }

        renderBooks(booksDatabase);
    </script>
